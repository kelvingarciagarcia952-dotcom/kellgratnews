name: Actualizar noticias

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Instalar dependencias
        run: npm install

      - name: Ejecutar pipeline completo de noticias
        run: npm run update

      - name: Verificar web/news.json
        run: |
          node -e "
          const fs = require('fs');
          const path = 'web/news.json';

          if (!fs.existsSync(path)) {
            console.error('ERROR: no existe web/news.json');
            process.exit(1);
          }

          const data = JSON.parse(fs.readFileSync(path, 'utf8'));

          if (!Array.isArray(data.items)) {
            console.error('ERROR: web/news.json no contiene un array items');
            process.exit(1);
          }

          console.log('=== RESUMEN FINAL ===');
          console.log('Noticias:', data.items.length);
          console.log('Schema:', data.schema_version ?? 'N/A');
          console.log('Actualizado:', data.updated_at ?? 'N/A');

          if (data.source_stats) {
            console.log('Fuentes activas:', data.source_stats.active_sources ?? 'N/A');
            console.log('Fuentes con resultados:', data.source_stats.successful_sources ?? 'N/A');
            console.log('Noticias recolectadas:', data.source_stats.collected_items ?? 'N/A');
          }

          if (data.validation) {
            console.log('Validación:', data.validation.status ?? 'N/A');
            console.log('Descartadas:', data.validation.rejected_items ?? 0);
            console.log('Límite:', data.validation.limit ?? 'N/A');
          }

          if (data.items.length === 0) {
            console.error('ERROR: no hay noticias en el archivo final');
            process.exit(1);
          }

          console.log('web/news.json válido y con contenido.');
          "

      - name: Configurar identidad de git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit y push de novedades
        run: |
          git add web/news.json

          if git diff --staged --quiet; then
            echo "No hay cambios nuevos, omitiendo commit"
          else
            git commit -m "Actualización automática de noticias"
            git push
            echo "Cambios publicados correctamente"
          fi
