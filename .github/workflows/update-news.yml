name: Actualizar noticias

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        run: npm install

      - name: Descargar, traducir y resumir noticias
        run: node scripts/fetch-news.js

      - name: Ping de mantenimiento
        run: echo "Manteniendo repositorio activo: $(date)"

      - name: Configurar identidad de git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit y push de novedades
        run: |
          git add web/news.json
          if git diff --staged --quiet; then
            echo "No hay cambios nuevos, omitiendo commit"
          else
            git commit -m "Actualización automática de noticias"
            git push
            echo "Cambios publicados correctamente"
          fi
